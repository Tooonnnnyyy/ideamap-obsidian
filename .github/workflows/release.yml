# Checks every pull request; on a version tag (for example 0.1.4) it builds the
# plugin, attests main.js and manifest.json (the directory's provenance check),
# and publishes the GitHub release Obsidian installs from.
name: Build and release

on:
  pull_request:
  push:
    tags: ["[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create the release
      id-token: write      # sign the attestation
      attestations: write  # store the attestation
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run release

      - name: Tag must match manifest version
        if: startsWith(github.ref, 'refs/tags/')
        run: test "$(node -p "require('./manifest.json').version")" = "${GITHUB_REF_NAME}"

      - uses: actions/attest-build-provenance@v4.2.2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          subject-path: |
            release/main.js
            release/manifest.json

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --generate-notes release/main.js release/manifest.json
